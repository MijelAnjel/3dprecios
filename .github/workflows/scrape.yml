name: Scrape Store Prices

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # trigger manual desde GitHub UI
    inputs:
      store:
        description: 'ID de tienda (opcional). Ej: impresalta'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        run: npm ci --prefix scraper

      - name: Run scrapers
        run: |
          STORE_ARG=""
          if [ -n "${{ github.event.inputs.store }}" ]; then
            STORE_ARG="-- --store=${{ github.event.inputs.store }}"
          fi
          npm run scrape --prefix scraper $STORE_ARG
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Export catalog.json
        run: npm run export --prefix scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Commit and push catalog.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/data/catalog.json
          git diff --cached --quiet || git commit -m "chore: update catalog.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::El scraper fallo. Revisar logs para mas detalles."
