name: Scrape Store Prices

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # trigger manual desde GitHub UI
    inputs:
      store:
        description: 'ID de tienda específica (opcional). Ej: impresalta'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        run: npm ci --prefix scraper

      - name: Run scrapers
        run: |
          STORE_ARG=""
          if [ -n "${{ github.event.inputs.store }}" ]; then
            STORE_ARG="-- --store=${{ github.event.inputs.store }}"
          fi
          npm run scrape --prefix scraper $STORE_ARG
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::El scraper falló. Revisar logs para más detalles."
