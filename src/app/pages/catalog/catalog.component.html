<app-breadcrumb [items]="breadcrumbs()" />

<div class="catalog container">

  <!-- Botón filtros móvil -->
  <div class="catalog__mobile-bar">
    <button
      class="catalog__filter-btn"
      type="button"
      [attr.aria-expanded]="mobileFiltersOpen()"
      aria-controls="filter-panel"
      (click)="toggleMobileFilters()"
    >
      <span aria-hidden="true">⚙</span> Filtros
      @if (hasActiveFilters()) {
        <span class="catalog__filter-badge" aria-label="Filtros activos">•</span>
      }
    </button>
  </div>

  <div class="catalog__layout">
    <!-- Sidebar filtros -->
    <div id="filter-panel">
      <app-filter-panel
        [specFields]="specFields()"
        [allProducts]="allProducts()"
        [mobileOpen]="mobileFiltersOpen()"
        (filtersChange)="onFiltersChange($event)"
        (close)="mobileFiltersOpen.set(false)"
      />
    </div>

    <!-- Área de productos -->
    <div class="catalog__main">

      <!-- Encabezado de categoría -->
      @if (category(); as cat) {
        <div class="catalog__cat-header">
          <span class="catalog__cat-icon" aria-hidden="true">{{ cat.icon }}</span>
          <h1 class="catalog__cat-title">{{ cat.name }}</h1>
        </div>
      } @else {
        <h1 class="catalog__cat-title">Todos los productos</h1>
      }

      <!-- Sort bar -->
      <app-sort-bar
        [total]="visibleProducts().length"
        [current]="sort()"
        (sortChange)="onSortChange($event)"
      />

      <!-- Grid -->
      <app-product-grid
        [products]="pagedProducts()"
        [loading]="loading()"
      />

      <!-- Paginación -->
      @if (totalPages() > 1) {
        <nav class="catalog__pagination" aria-label="Paginación">
          <button
            class="catalog__page-btn"
            type="button"
            [disabled]="page() === 1"
            (click)="goToPage(page() - 1)"
            aria-label="Página anterior"
          >‹</button>

          @for (p of pageRange(); track p) {
            @if (p < 0) {
              <span class="catalog__page-ellipsis" aria-hidden="true">…</span>
            } @else {
              <button
                class="catalog__page-btn"
                [class.catalog__page-btn--active]="page() === p"
                type="button"
                (click)="goToPage(p)"
                [attr.aria-label]="'Página ' + p"
                [attr.aria-current]="page() === p ? 'page' : null"
              >{{ p }}</button>
            }
          }

          <button
            class="catalog__page-btn"
            type="button"
            [disabled]="page() === totalPages()"
            (click)="goToPage(page() + 1)"
            aria-label="Página siguiente"
          >›</button>
        </nav>
      }
    </div>
  </div>
</div>
